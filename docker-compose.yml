name: njuvachampion

services:
  mysql:
    image: mysql:8.0
    container_name: njuvachampion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: njuvachampion
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app-net]

  backend:
    build: ./backend
    container_name: njuvachampion-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/njuvachampion?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      APP_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  ocr:
    build: ./valorant-ocr
    container_name: njuvachampion-ocr
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 使用宿主机 Miniconda 的 valorant-ocr 环境（与本地一致：python3.10 + paddleocr 2.10.0 + paddlepaddle 2.6.2）
      PATH: /opt/conda/envs/valorant-ocr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${OCR_CONDA_ENV_PATH:-/home/ubuntu/miniconda3/envs/valorant-ocr}:/opt/conda/envs/valorant-ocr:ro
      - ${OCR_PADDLE_HOME:-/home/ubuntu/.paddleocr}:/root/.paddleocr:rw
    networks: [app-net]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        OCR_URL: http://ocr:3200
    container_name: njuvachampion-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8080
      OCR_URL: http://ocr:3200
      TZ: Asia/Shanghai
    depends_on:
      - backend
      - ocr
    networks: [app-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: njuvachampion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    depends_on:
      - frontend
    networks: [app-net]

volumes:
  mysql-data:
  uploads-data:

networks:
  app-net:
