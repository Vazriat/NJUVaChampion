# ============================================================================
# 生产 HTTPS 配置
#   主域名：njuvlr.online       www.njuvlr.online 301 跳转到主域名
#   证书：Let's Encrypt，certbot 写入宿主机 ./certbot/conf，
#         该目录已由 docker-compose 挂载到容器 /etc/letsencrypt
#
# 改完本文件后生效方式：
#   docker compose exec nginx nginx -t          # 先验语法
#   docker compose exec nginx nginx -s reload   # 再 reload
#
# ⚠️ 如果你改的是 docker-compose.yml 里的 volumes，光 reload 无效——
#    bind mount 在容器创建时就固定了 inode，必须重建容器：
#   docker compose up -d --force-recreate --no-deps nginx
# ============================================================================

# ---------- HTTP：只放行 ACME 挑战，其余全部 301 到 HTTPS ----------
server {
    listen 80;
    server_name njuvlr.online;

    # 证书续期靠它，删不得
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://njuvlr.online$request_uri; }
}

server {
    listen 80;
    server_name www.njuvlr.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://njuvlr.online$request_uri; }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name njuvlr.online;

    ssl_certificate     /etc/letsencrypt/live/njuvlr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njuvlr.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- HTTPS：www 301 到主域名 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.njuvlr.online;

    ssl_certificate     /etc/letsencrypt/live/njuvlr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njuvlr.online/privkey.pem;

    return 301 https://njuvlr.online$request_uri;
}
